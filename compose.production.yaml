# Preparation only: the stock worker is a deterministic stub and blocks deployment.
# Select exactly ONE of the local-db / managed-db overrides. Never combine with compose.yaml.
name: hatoove-production

# Resource ceilings. This droplet also runs an unrelated service on port 6432, so every
# Hatoove container is capped: memswap_limit equals mem_limit, so a container that reaches
# its ceiling is killed inside its own limit rather than pushing the host into swap or
# triggering a host-wide OOM kill near that other service. The runtime ceilings total about
# 1.3 GiB and the local database adds 1.5 GiB. Treat the remaining headroom as an assumption
# to verify with `free -m` on the real host, not as measured capacity: a "4 GiB" droplet
# reports under 4 GiB of MemTotal once the kernel reserves its own share.
# A container heap flag is deliberately NOT set: this file's checker rejects NODE_OPTIONS as a
# policy environment leak and pins the exact command array, so a --max-old-space-size flag
# would require widening that assertion. A service that reaches its ceiling therefore dies
# without a JavaScript error. The operator procedure's --exit-code-from migrate reports a
# failed migration, and a failed migration deliberately leaves app and worker stopped.

x-database: &database
  OWNAPI_PG_DATABASE: "${OWNAPI_PG_DATABASE:?Select the dedicated installation database}"
  OWNAPI_PG_USER: "${HATOVE_PG_ADMIN_USER:?Select the bootstrap database username}"
  OWNAPI_PG_SCHEMA: "${OWNAPI_PG_SCHEMA:-hatoove}"
  OWNAPI_PG_ROLE_PREFIX: "${OWNAPI_PG_ROLE_PREFIX:-hatoove}"
  # Invalid deliberately: the base alone must fail before a database connection.
  OWNAPI_PG_HOST: select-one-database-override.invalid
  OWNAPI_PG_TLS_MODE: select-one-database-override
  OWNAPI_PG_REQUIRE_PASSWORDS: "1"
  OWNAPI_PG_CONNECT_TIMEOUT_MS: "5000"
  OWNAPI_PG_POOL_AUTH_MAX: "2"
  OWNAPI_PG_POOL_LEARNER_MAX: "2"
  OWNAPI_PG_POOL_WORKER_MAX: "1"
  OWNAPI_PG_POOL_DELETION_MAX: "1"
  OWNAPI_PG_POOL_PAYMENTS_MAX: "1"
  OWNAPI_PG_POOL_PROVISIONER_MAX: "1"
  OWNAPI_PG_POOL_ADMIN_MAX: "1"
  OWNAPI_PG_POOL_MIGRATION_MAX: "1"
  OWNAPI_PG_WORKER_RUNNER_POOL_MAX: "1"
  OWNAPI_PG_APP_REPLICAS: "1"
  OWNAPI_PG_WORKER_REPLICAS: "1"
  # 9 app (including readiness) + 1 runner + 2 concurrent deployment = 12.
  # Required allocation is an operator decision, not evidence of spare shared capacity.
  OWNAPI_PG_CONNECTION_BUDGET: "${OWNAPI_PG_CONNECTION_BUDGET:?Allocate and verify a database connection budget of at least 12}"
  # CONTENT MODE IS AN OPERATOR SETTING, and it decides whether anything is served at all.
  # `public` requires APPROVED content ("public requires approved content even if legacy flags request
  # unreviewed", EXAM-S0-20261002-A:21). With it, every release in this installation is `internal` and
  # unreviewed, so `readReleasedForm` answers null and a learner sees "nothing is released" — which is what
  # happened in production on 4 October 2026. `internal-preview` is the pilot's documented posture and the
  # default `compose.yaml` already uses. Pin `public` as soon as the content has actually been approved.
  B1PREP_CONTENT_MODE: "${HATOVE_CONTENT_MODE:-internal-preview}"

x-runtime: &runtime
  image: "${HATOVE_APP_IMAGE:?Select the reviewed application image by digest}"
  pull_policy: never
  init: true
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  networks: [backend]

services:
  migrate:
    <<: *runtime
    command: [node, server/migrate.mjs]
    restart: "no"
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 64
    environment:
      <<: *database
      OWNAPI_PG_ALLOW: "1"
      OWNAPI_PG_PASSWORD_FILE: /run/secrets/pg_admin
      OWNAPI_PG_MIGRATION_PASSWORD_FILE: /run/secrets/pg_migration
      OWNAPI_PG_AUTH_PASSWORD_FILE: /run/secrets/pg_auth
      OWNAPI_PG_LEARNER_PASSWORD_FILE: /run/secrets/pg_learner
      OWNAPI_PG_WORKER_PASSWORD_FILE: /run/secrets/pg_worker
      OWNAPI_PG_DELETION_PASSWORD_FILE: /run/secrets/pg_deletion
      OWNAPI_PG_PAYMENTS_PASSWORD_FILE: /run/secrets/pg_payments
      OWNAPI_PG_PROVISIONER_PASSWORD_FILE: /run/secrets/pg_provisioner
    secrets: [pg_admin, pg_migration, pg_auth, pg_learner, pg_worker, pg_deletion, pg_payments, pg_provisioner]

  app:
    <<: *runtime
    command: [node, server.js]
    restart: unless-stopped
    stop_grace_period: 60s
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 256
    networks: [application, backend]
    environment:
      <<: *database
      B1PREP_SAAS: "1"
      B1PREP_ACCOUNTS: "1"
      B1PREP_REQUIRE_HTTPS: "1"
      B1PREP_PUBLIC_ORIGIN: https://hatoove.com
      B1PREP_BIND: 0.0.0.0
      B1PREP_PORT: "4321"
      PAYMENTS_MODE: "off"
      # The pilot is free until this calendar day (PILOT-WINDOW-01). It is declared here, beside
      # PAYMENTS_MODE, so the date the landing page states and the date the runtime can read are one
      # value rather than two copies of prose. `server.js#readPilotFreeUntil()` parses it and
      # `tools/seo-check.mjs` leg S10 fails if the page's FAQ states any other date. This slice does
      # NOT enforce it: no entitlement, access or payment decision reads it yet.
      PILOT_FREE_UNTIL: "2027-01-14"
      OWNAPI_PG_AUTH_PASSWORD_FILE: /run/secrets/pg_auth
      OWNAPI_PG_LEARNER_PASSWORD_FILE: /run/secrets/pg_learner
      OWNAPI_PG_WORKER_PASSWORD_FILE: /run/secrets/pg_worker
      OWNAPI_PG_DELETION_PASSWORD_FILE: /run/secrets/pg_deletion
      OWNAPI_PG_PAYMENTS_PASSWORD_FILE: /run/secrets/pg_payments
      OWNAPI_PG_PROVISIONER_PASSWORD_FILE: /run/secrets/pg_provisioner
    secrets: [pg_auth, pg_learner, pg_worker, pg_deletion, pg_payments, pg_provisioner]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4321/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      start_period: 20s
      retries: 6

  worker:
    <<: *runtime
    command: [node, server/worker.mjs]
    restart: unless-stopped
    stop_grace_period: 60s
    mem_limit: 384m
    memswap_limit: 384m
    pids_limit: 128
    environment:
      <<: *database
      OWNAPI_PG_WORKER_PASSWORD_FILE: /run/secrets/pg_worker
    secrets: [pg_worker]
    depends_on:
      migrate:
        condition: service_completed_successfully

  ingress:
    image: "${HATOVE_CADDY_IMAGE:?Select a verified stock Caddy image by digest}"
    pull_policy: never
    restart: unless-stopped
    # Larger than the other sidecars because Caddy is the only public entry point: an OOM
    # kill here is a total outage rather than a degraded background job.
    mem_limit: 192m
    memswap_limit: 192m
    pids_limit: 128
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    ports:
      - "80:80"
      - "443:443"
    networks: [edge, application]
    volumes:
      - type: bind
        source: ./deploy/Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
      - caddy-data:/data
      - caddy-config:/config
    # No app dependency: certificate bootstrap must work while app/worker are stopped.

networks:
  edge: {}
  application:
    internal: true
  backend: {}

volumes:
  caddy-data:
    external: true
    name: "${HATOVE_CADDY_DATA_VOLUME:?Select the retained certificate volume}"
  caddy-config:
    external: true
    name: "${HATOVE_CADDY_CONFIG_VOLUME:?Select the retained Caddy configuration volume}"

secrets:
  pg_admin:
    file: "${HATOVE_PG_ADMIN_PASSWORD_SOURCE:?Select the external admin password file}"
  pg_migration:
    file: "${HATOVE_PG_MIGRATION_PASSWORD_SOURCE:?Select the external migration password file}"
  pg_auth:
    file: "${HATOVE_PG_AUTH_PASSWORD_SOURCE:?Select the external auth password file}"
  pg_learner:
    file: "${HATOVE_PG_LEARNER_PASSWORD_SOURCE:?Select the external learner password file}"
  pg_worker:
    file: "${HATOVE_PG_WORKER_PASSWORD_SOURCE:?Select the external worker password file}"
  pg_deletion:
    file: "${HATOVE_PG_DELETION_PASSWORD_SOURCE:?Select the external deletion password file}"
  pg_payments:
    file: "${HATOVE_PG_PAYMENTS_PASSWORD_SOURCE:?Select the external payments password file}"
  pg_provisioner:
    file: "${HATOVE_PG_PROVISIONER_PASSWORD_SOURCE:?Select the external provisioner password file}"
