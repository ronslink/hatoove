openapi: 3.0.3
info:
  title: Hatoove API
  version: 0.1.0
  description: |
    The Hatoove server API. **The API is the product**: the client holds no state, no provider key
    and no grading logic, and submits a reference and receives a result.

    ## Conventions this document is held to

    - **Routes require sessions unless an explicit alternate boundary applies.** `GET /api/health`
      and `GET /api/ready` are public. The exact Stripe webhook POST uses its signed raw body.
      Every other route, including `/api/auth/**`, is either public by necessity (you cannot sign in
      from behind a sign-in gate) or requires a verified session.
    - **No data comes from files.** Learner data is served by these endpoints. There is no `/data/`
      route: it is retired and answers 404, deliberately, rather than 401 — a 401 would say "sign in
      and you can have this", which is false.
    - **Browser mutations require `Content-Type: application/json` and a same-origin `Origin`.** A
      refused origin is `403 origin_rejected`; a missing content type is `415 json_required`.
      Only the exact payment webhook POST bypasses Origin/session checks; it verifies Stripe-Signature.
    - **A failure is never a success.** A route that cannot answer says so: `503 not_ready` while the
      runtime is not ready, `401 unauthenticated`, `404 not_found`, `409` on a conflict.
    - **Account consistency.** The learner app supplies optional `X-Hatoove-Account` on owned routes,
      get-session and sign-out. A mismatch with the verified session returns `409 account_changed`
      before any data operation. This is a precondition, never an ownership selector.
    - **Not ready ⇒ 503, in every mode.** Omitting `B1PREP_SAAS` does not re-open a single-user path.

    `tools/api-spec-check.mjs` verifies this document against a running server: every operation here
    is probed anonymously and must answer exactly what its `security` declares. Drift is a failing
    check, not a surprise.

servers:
  - url: http://localhost:4300
    description: Local server (Docker Compose). Use ONE host consistently — cookies are host-scoped, so a session created at `localhost` is not sent to `127.0.0.1`.

tags:
  - name: payments
    description: Owned test checkout and signature-verified provider events; purchases are off by default.
  - name: liveness
    description: Public. For supervisors and container healthchecks.
  - name: auth
    description: Public by necessity — registration, sign-in, sign-out, session.
  - name: account
    description: The signed-in learner's own account.
  - name: settings
    description: Server-stored learner settings.
  - name: preparations
    description: |
      EXAM-S1. A preparation is one learner preparing for one exam package. Tasks, objective sets,
      practice, attempt lists, objective answers and new writing attempts are scoped to one by a
      required `preparationId`; missing or malformed is `422 preparation_required`/`invalid_preparation`,
      another owner's or an absent one is `404`, content of another exam is `422 preparation_mismatch`.
      Credits are keyed by (account, exam), never by preparation.
  - name: catalogue
    description: The servable task catalogue.
  - name: attempts
    description: Owned writing attempts, submissions and results.
  - name: mock-runs
    description: Version-pinned section practice with saved answers and feedback after finalisation.

paths:
  /api/v1/mock-forms:
    get:
      tags: [mock-runs]
      summary: List released forms for the owned preparation
      parameters:
        - $ref: '#/components/parameters/PreparationQuery'
      description: Only the enabled exam and current permitted release are discoverable. An archived preparation has no startable forms. Internal forms require the internal-preview deployment policy.
      responses:
        '200':
          description: Released form summaries, or an empty list.
          content:
            application/json:
              schema: { type: object, properties: { forms: { type: array, items: { $ref: '#/components/schemas/MockForm' } } } }
        '404': { description: 'Preparation absent or owned by someone else.' }
        '422': { description: 'Preparation context missing, invalid or exam unavailable.' }
        '503': { description: 'Saved-run capability unavailable.' }

  /api/v1/mock-runs:
    get:
      tags: [mock-runs]
      summary: List saved runs for the owned preparation
      parameters:
        - $ref: '#/components/parameters/PreparationQuery'
      description: Newest first, at most 100. Archived preparation history remains readable. Summaries include identity, state and timestamps but no members, responses, position or result.
      responses:
        '200':
          description: Saved run summaries.
          content:
            application/json:
              schema: { type: object, properties: { runs: { type: array, items: { $ref: '#/components/schemas/MockRunSummary' } } } }
        '404': { description: 'Preparation absent or owned by someone else.' }
    post:
      tags: [mock-runs]
      summary: Start a new version-pinned section practice run
      description: Pins the exact current release, blueprint and form. The owner comes from the session. Repeating an event with the identical body returns the same run; changing its body conflicts. A retake requires a fresh event. No writing job or credit debit is created.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [preparationId, formId, formVersion, releaseVersion, eventId]
              properties:
                preparationId: { type: string, format: uuid }
                formId: { type: string }
                formVersion: { type: string, pattern: '^v[0-9]{1,4}$' }
                releaseVersion: { type: string, pattern: '^v[0-9]{1,4}$' }
                eventId: { type: string, format: uuid }
      responses:
        '201': { description: 'Created. Body is the full run DTO.', content: { application/json: { schema: { $ref: '#/components/schemas/MockRun' } } } }
        '200': { description: 'Identical event retry. Body is the current full run DTO.', content: { application/json: { schema: { $ref: '#/components/schemas/MockRun' } } } }
        '404': { description: 'Owned preparation or exact permitted form not found.' }
        '409': { description: 'Archived preparation or event-body conflict.' }
        '422': { description: 'Invalid request or disabled exam.' }

  /api/v1/mock-runs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [mock-runs]
      summary: Resume or read the exact owned run
      description: Ordinary release withdrawal preserves pinned history. An explicit rights block keeps the saved answers and identity readable, withholds members and result, and sets blocked_reason. No answers or explanations are revealed while active.
      responses:
        '200': { description: 'Full owned run DTO.', content: { application/json: { schema: { $ref: '#/components/schemas/MockRun' } } } }
        '404': { description: 'Absent or owned by someone else.' }
    put:
      tags: [mock-runs]
      summary: Save the complete answer snapshot and position
      description: Revision starts at 1. Exact form item IDs and offered answers only. Writes serialize with finalisation, preparation archive and account deletion. An identical event retry returns the current safe acknowledgement; a stale new event conflicts. Finalised, expired, archived or rights-blocked runs cannot be saved.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedRevision, eventId, responses, position]
              properties:
                expectedRevision: { type: integer, minimum: 1, maximum: 2147483646 }
                eventId: { type: string, format: uuid }
                responses: { type: array, maxItems: 500, items: { $ref: '#/components/schemas/MockResponse' } }
                position: { $ref: '#/components/schemas/MockPosition' }
      responses:
        '200': { description: 'Full run with the acknowledged revision.', content: { application/json: { schema: { $ref: '#/components/schemas/MockRun' } } } }
        '404': { description: 'Absent or owned by someone else.' }
        '409': { description: 'Revision/event conflict, finalised, expired, archived or content blocked.' }
        '422': { description: 'Invalid answer, item, position or unknown request field.' }

  /api/v1/mock-runs/{id}/playback:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [mock-runs]
      summary: Read authoritative recording consumption for an active owned run
      description: Reading does not consume a play. A returned playing record is uncertain and needs explicit same-play recovery. Finalised, expired, archived or rights-blocked playback refuses while saved responses remain readable through the run.
      responses:
        '200': { description: 'Pinned recording progress.', content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Playback' } } } } } } }
        '404': { description: 'Absent or another owner.' }
        '409': { description: 'Run no longer permits playback.' }
    post:
      tags: [mock-runs]
      summary: Start, checkpoint, pause, complete or explicitly recover one recording
      description: Session owner and pinned recording determine allowance. Revision is independent of answer autosave. Retrying an event is idempotent; a different body under the same event conflicts. Recover rotates the playback identity and cannot add an allowance. Failed pre-play loading consumes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [eventId, mediaId, mediaVersion, expectedRevision, action]
              properties:
                eventId: { type: string, format: uuid }
                mediaId: { type: string }
                mediaVersion: { type: string }
                expectedRevision: { type: integer, minimum: 0, maximum: 2147483646 }
                action: { type: string, enum: [begin, checkpoint, pause, complete, recover] }
                playbackId: { type: string, format: uuid, description: Required after begin; identifies the current play rather than an HTTP request. }
                positionMs: { type: integer, minimum: 0, maximum: 3600000, description: Required for checkpoint/pause/complete; forbidden on recover. }
      responses:
        '200': { description: 'Current safe acknowledgement.', content: { application/json: { schema: { type: object, properties: { playback: { $ref: '#/components/schemas/Playback' } } } } } }
        '404': { description: 'Absent, another owner or non-member recording.' }
        '409': { description: 'Revision/event/playback conflict, exhausted allowance, recovery required, expired/finalised run or unavailable media.' }
        '422': { description: 'Invalid or backward progress; unknown request fields.' }

  /api/v1/mock-runs/{id}/media/{mediaId}/{version}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: mediaId
        in: path
        required: true
        schema: { type: string }
      - name: version
        in: path
        required: true
        schema: { type: string }
      - name: Range
        in: header
        schema: { type: string }
    get:
      tags: [mock-runs]
      summary: Load exact private recording bytes for an active owned run
      description: Membership, rights, session/account context and complete checksum are checked before response headers. Preload and byte ranges never consume a play. No public/static media equivalent exists. Replies use private no-store caching, checksum ETag and byte-range headers.
      responses:
        '200': { description: 'Exact complete PCM WAV.', content: { audio/wav: { schema: { type: string, format: binary } } } }
        '206': { description: 'One satisfiable byte range, with Content-Range and exact Content-Length.' }
        '404': { description: 'Absent, another owner or non-member recording.' }
        '409': { description: 'Rights/access/deadline refusal or media unavailable/integrity failure.' }
        '416': { description: 'Invalid, multiple or unsatisfiable byte range.' }
    head:
      tags: [mock-runs]
      summary: Inspect the same protected recording headers without a response body
      responses:
        '200': { description: 'Same verified headers and Content-Length as GET; no response body.' }
        '206': { description: 'Same range headers as GET; no response body.' }
        '404': { description: 'Absent, another owner or non-member recording.' }
        '409': { description: 'Rights/access/deadline refusal or media unavailable/integrity failure.' }
        '416': { description: 'Invalid or unsatisfiable byte range.' }

  /api/v1/mock-runs/{id}/writing-choice:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [mock-runs]
      summary: Bind one immutable writing option to the owned saved run
      description: 'Creates the initial attempt and draft atomically. The server resolves the exact prompt and rubric from the pinned form. An acknowledged choice cannot be replaced. A repeated event returns its original selection; another body under the same event conflicts. Internal and withdrawn content gates remain authoritative.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedRevision, eventId, choiceGroupId, optionId]
              properties:
                expectedRevision: { type: integer, minimum: 1 }
                eventId: { type: string, format: uuid }
                choiceGroupId: { type: string }
                optionId: { type: string, enum: [A, B] }
      responses:
        '200': { description: 'Full run with the immutable selected option and attached draft.', content: { application/json: { schema: { $ref: '#/components/schemas/MockRun' } } } }
        '401': { description: Session required }
        '404': { description: Owned run absent }
        '409': { description: Revision, event, selection, finalisation or content conflict }
        '422': { description: Invalid request or unavailable exam }
  /api/v1/mock-runs/{id}/finalise:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [mock-runs]
      summary: Finalise acknowledged answers and reveal deterministic feedback
      description: Atomically freezes acknowledged objective answers and the selected writing draft. A selected writing attachment requires explanationLanguage and expectedWritingRevision. Empty or credit-exhausted writing remains submitted and unassessed without consuming another exam's allowance. Pending or failed writing never removes objective results. An expired run retains its server deadline. Repeated finalisation returns the stored result and does not create another submission or debit. There is no overall exam grade or pass prediction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedRevision, eventId]
              properties:
                expectedRevision: { type: integer, minimum: 1, maximum: 2147483646 }
                eventId: { type: string, format: uuid }
                expectedWritingRevision: { type: integer, minimum: 1, description: Required when a writing option has been selected. }
                explanationLanguage: { type: string, enum: [de, en, uk, ar, tr], description: Required after writing selection; saved with the submission. }
      responses:
        '200': { description: 'Full finalised run with deterministic per-item feedback.', content: { application/json: { schema: { $ref: '#/components/schemas/MockRun' } } } }
        '404': { description: 'Absent or owned by someone else.' }
        '409': { description: 'Stale revision, event conflict, archived preparation or content blocked.' }
        '422': { description: 'Invalid revision, event or unknown request field.' }

  /api/health:
    get:
      tags: [liveness]
      summary: Liveness only
      description: Reveals nothing about the provider key — no `configured`, no `model`, no `baseUrl`.
      security: []
      responses:
        '200':
          description: The process is alive.
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean }, node: { type: string } } }

  /api/ready:
    get:
      tags: [liveness]
      summary: Readiness
      description: Reports whether the runtime is ready and in which mode. `503` while starting, while the schema is behind, or when configuration is missing.
      security: []
      responses:
        '200':
          description: Ready.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  ready: { type: boolean }
                  mode: { type: string, enum: [saas, local, unconfigured] }
                  reason: { type: string }
        '503':
          description: Not ready; the reason token names why.

  /api/auth/sign-up/email:
    post:
      tags: [auth]
      summary: Register with email and password
      description: |
        Creates the account. There is **no invite** (Ron, 2 October 2026) and, at present, no email
        verification and no throttle — see PILOT-18, which owns the abuse controls. The response sets
        the session cookie.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200': { description: 'Account created; session cookie set.' }
        '403': { description: 'Origin refused (`origin_rejected`).' }
        '415': { description: 'Content type must be application/json (`json_required`).' }
        '422': { description: 'Invalid input, or the email already has an account (`user_exists`).' }

  /api/auth/sign-in/email:
    post:
      tags: [auth]
      summary: Sign in
      description: |
        A wrong password and an unknown email are refused with the **identical** response, so this
        endpoint is not an oracle for who has an account.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200': { description: 'Signed in; session cookie set.' }
        '401': { description: 'Invalid credentials — identical for a wrong password and an unknown email.' }

  /api/auth/sign-out:
    post:
      tags: [auth]
      summary: Sign out
      description: Ends the session server-side. The cookie is dead afterwards.
      security: []
      responses:
        '200': { description: 'Session ended.' }

  /api/auth/get-session:
    get:
      tags: [auth]
      summary: The current session
      security: []
      responses:
        '200': { description: 'The session and its user, or a null session when signed out.' }

  /api/v1/account:
    get:
      tags: [account]
      summary: Read the signed-in learner's account
      responses:
        '200':
          description: The account.
          content:
            application/json:
              schema:
                type: object
                properties:
                  contractVersion: { type: string }
                  id: { type: string }
                  email: { type: string, format: email }
        '401': { description: 'No verified session.' }
    delete:
      tags: [account]
      summary: Delete the account
      description: |
        Really deletes the learner's own records. Requires an **empty JSON body** (`{}`): every
        mutating route requires `application/json`, so a bodyless DELETE is refused with `415`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '200': { description: 'Account and owned records deleted.' }
        '503': { description: 'Deletion port not wired (`deletion_unavailable`).' }

  /api/v1/sentence-check:
    post:
      tags: [attempts]
      summary: Get conservative structural hints for a German sentence
      description: |
        Authenticated deterministic teaching aid. Does not store the supplied text or contact a model.
        It returns no score, correctness verdict, exam result or complete grammar assessment.
        The result always includes limited=true and an explicit German limitation. At most 24
        clauses are analysed; truncated=true and a clause_limit hint identify any omitted remainder.
        Verb indices and flattened hint clause indices are zero-based.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '200':
          description: Structural hints with explicit uncertainty; an empty hints list does not mean correct.
          content:
            application/json:
              schema:
                type: object
                properties:
                  kind: { type: string, enum: [structural-hints] }
                  version: { type: string, enum: [satzbau-heuristic-v1] }
                  language: { type: string, enum: [de] }
                  limited: { type: boolean, enum: [true] }
                  limitation: { type: string }
                  truncated: { type: boolean }
                  clauses:
                    type: array
                    maxItems: 24
                    items:
                      type: object
                      properties:
                        text: { type: string }
                        tokens: { type: array, items: { type: string } }
                        type: { type: string, enum: [main, subordinate, question, uncertain] }
                        trigger: { type: string, nullable: true }
                        finite:
                          type: object
                          nullable: true
                          properties:
                            word: { type: string }
                            index: { type: integer, minimum: 0 }
                        rule: { type: string }
                        hints: { type: array, items: { type: object } }
                  hints:
                    type: array
                    description: 'Flattened hints with clause (index or null), code, severity (hint or uncertain), and message.'
                    items: { type: object }
        '401': { description: 'No verified session.' }
        '403': { description: 'Origin refused.' }
        '422': { description: 'Blank, non-string, too-long text or unsupported input fields.' }

  /api/v1/exams:
    get:
      tags: [preparations]
      summary: The exam packages this deployment offers
      description: Server configuration decides; S1 offers telc Deutsch B1 only. A database row alone does not publish a package.
      responses:
        '200':
          description: The offered packages.
          content:
            application/json:
              schema:
                type: object
                properties:
                  exams:
                    type: array
                    items:
                      type: object
                      properties:
                        exam_id: { type: string }
                        exam: { type: string }
                        exam_language: { type: string }
                        level: { type: string }
        '401': { description: 'No verified session.' }

  /api/v1/preparations:
    get:
      tags: [preparations]
      summary: Every preparation of the account, archived history included
      responses:
        '200':
          description: The preparations.
          content:
            application/json:
              schema:
                type: object
                properties:
                  preparations: { type: array, items: { $ref: '#/components/schemas/Preparation' } }
        '401': { description: 'No verified session.' }
    post:
      tags: [preparations]
      summary: Start (or return) the active preparation for an exam
      description: Idempotent. An existing active preparation is returned unchanged with `200`; its date is not overwritten. Never grants or refills credits.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [examId]
              properties:
                examId: { type: string }
      responses:
        '200': { description: 'The existing active preparation.' }
        '201': { description: 'A new active preparation.' }
        '401': { description: 'No verified session.' }
        '403': { description: 'Origin refused.' }
        '422': { description: '`invalid_exam`, `exam_unavailable` or `unknown_field`.' }

  /api/v1/preparations/{preparationId}:
    parameters:
      - { name: preparationId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [preparations]
      summary: Read one preparation
      responses:
        '200':
          description: The preparation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preparation' }
        '401': { description: 'No verified session.' }
        '404': { description: 'Absent, or another account''s.' }
    put:
      tags: [preparations]
      summary: Edit the exam date and/or state
      description: |
        Revision-guarded. A stale `expectedRevision` is `409 preparation_conflict` with the current
        preparation in `current`. `examDate` must be a real calendar date or `null`. The exam is
        immutable. Resuming while another preparation for the same exam is active is
        `409 active_preparation_exists`. Archiving keeps history readable and pending jobs finishable;
        no new practice is accepted in an archived preparation (`409 preparation_archived`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedRevision]
              properties:
                expectedRevision: { type: integer, minimum: 1 }
                examDate: { type: string, format: date, nullable: true }
                state: { type: string, enum: [active, archived] }
      responses:
        '200': { description: 'The updated preparation.' }
        '401': { description: 'No verified session.' }
        '404': { description: 'Absent, or another account''s.' }
        '409': { description: '`preparation_conflict` (with `current`) or `active_preparation_exists`.' }
        '422': { description: '`invalid_exam_date`, `invalid_preparation_update` or `unknown_field`.' }

  /api/v1/preparations/{preparationId}/credits:
    parameters:
      - { name: preparationId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [preparations]
      summary: The exam balance behind a preparation
      description: Credits belong to (account, exam). An exam with no balance reads as zero; reading never grants.
      responses:
        '200':
          description: The balance.
          content:
            application/json:
              schema:
                type: object
                properties:
                  examId: { type: string }
                  allowance: { type: integer }
                  used: { type: integer }
                  reserved: { type: integer }
                  available: { type: integer }
        '401': { description: 'No verified session.' }
        '404': { description: 'Absent, or another account''s.' }

  /api/v1/settings:
    get:
      tags: [settings]
      summary: Read settings
      responses:
        '200':
          description: Settings and the revision they are at.
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings:
                    type: object
                    properties:
                      examDate: { type: string, description: 'Read-only legacy value, kept for audit and export. The active exam date is on the preparation (EXAM-S1).' }
                      language: { type: string, enum: [de, en, uk, ar, tr], description: 'Explanation language only. The interface stays German.' }
                      dailyGoal: { type: string }
                      model: { type: string }
                      theme: { type: string }
                  revision: { type: integer }
        '401': { description: 'No verified session.' }
        '503': { description: 'Settings port not wired (`settings_unavailable`).' }
    put:
      tags: [settings]
      summary: Write settings
      description: Optimistic concurrency. A stale `expectedRevision` is refused with `409` rather than silently overwriting another device's change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedRevision]
              properties:
                expectedRevision: { type: integer }
                settings:
                  type: object
                  description: '`examDate` is no longer accepted (EXAM-S1): the date is set on the preparation.'
                  properties:
                    dailyGoal: { type: integer }
                    theme: { type: string, enum: [system, light, dark] }
                    language: { type: string, enum: [de, en, uk, ar, tr] }
      responses:
        '200': { description: 'Written; the new revision is returned.' }
        '409': { description: 'The revision was stale (`settings_conflict`).' }
        '422': { description: 'Invalid settings (`invalid_settings`).' }

  /api/v1/tasks:
    get:
      tags: [catalogue]
      summary: List servable task versions
      description: |
        The catalogue the **Üben** view lists. Each entry carries its true `review_status` and
        `rights_status`, so a learner is told the truth about the content rather than shown an
        implied approval.

        **The serving policy is deployment configuration, not a request parameter** (EXAM-S0, one
        server-owned policy). `B1PREP_CONTENT_MODE=public` — the default when unset — serves approved
        content only, and the legacy `B1PREP_SERVE_REVIEW` flag cannot widen it; today that is an empty
        list because every seeded row is `unreviewed`. `B1PREP_CONTENT_MODE=internal-preview` explicitly
        retains the unreviewed pilot policy (`B1PREP_SERVE_REVIEW=approved` still narrows it). Any other
        mode fails closed and serves nothing. A task is listed only when its declared rubric is servable
        too. A request may NARROW the list and may never widen it.
      parameters:
        - $ref: '#/components/parameters/PreparationQuery'
        - name: exam
          in: query
          required: false
          schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,63}$' }
          description: Optional; may only equal the preparation's exam (`422 preparation_mismatch` otherwise).
        - name: family
          in: query
          required: false
          schema: { type: string, pattern: '^[a-z][a-z0-9_-]{0,31}$' }
          description: The task family, e.g. `writing`.
      responses:
        '200':
          description: The servable versions — possibly empty, which is an answer from the server rather than an empty page.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TaskVersion' }
        '401': { description: 'No verified session.' }
        '422': { description: 'Invalid `exam` or `family` (`invalid_exam`, `invalid_family`).' }
        '503': { description: 'Catalogue port not wired (`catalogue_unavailable`).' }

  /api/v1/objective-sets/{setId}:
    parameters:
      - name: setId
        in: path
        required: true
        schema: { type: string, pattern: '^[A-Za-z0-9._-]{1,128}$' }
    get:
      tags: [catalogue]
      summary: Read one servable objective set at an exact version
      description: |
        The version is REQUIRED and never defaulted (EXAM-S0): two versions of one set may share item
        ids with different keys, so the client must bind the exact `(set_id, version)` pair it took from
        the catalogue. The response carries no answer key. Imported sets include an interaction identifier
        resolved from exact current permitted release membership; ambiguous metadata fails closed. The
        deployment content policy applies, as for `/api/v1/tasks`. The internal `grouped_choice` payload
        has ordered groups with id, text and questions (n, question, options); item identities are unique
        across all groups. The interaction, rather than a telc family assumption, determines rendering.
      parameters:
        - $ref: '#/components/parameters/PreparationQuery'
        - name: version
          in: query
          required: true
          schema: { type: string, pattern: '^v[0-9]{1,4}$' }
      responses:
        '200': { description: 'The set at that exact version, with its learner-visible payload. A set of another exam is `422 preparation_mismatch`.' }
        '401': { description: 'No verified session.' }
        '404': { description: 'No such servable `(set_id, version)` pair — unknown and withheld are indistinguishable.' }
        '422': { description: 'Missing or invalid `version` (`invalid_version`).' }
        '503': { description: 'Catalogue port not wired (`catalogue_unavailable`).' }

  /api/v1/objective-sets/{setId}/answers:
    parameters:
      - name: setId
        in: path
        required: true
        schema: { type: string, pattern: '^[A-Za-z0-9._-]{1,128}$' }
    post:
      tags: [catalogue]
      summary: Answer one objective item, marked server-side against the exact version's key
      description: |
        `version` is REQUIRED (EXAM-S0); an omitted version is refused rather than marked against v1.
        The evidence row is append-only and records the exact version. Only the boolean is returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [preparationId, version, itemId, answer]
              properties:
                preparationId: { type: string, format: uuid, description: 'EXAM-S1. Must be an owned, active preparation of the set''s exam; checked before marking or writing.' }
                version: { type: string, pattern: '^v[0-9]{1,4}$' }
                itemId: { type: string, pattern: '^[A-Za-z0-9._-]{1,64}$' }
                answer: {}
                latencyMs: { type: integer, minimum: 0, maximum: 3600000 }
      responses:
        '201': { description: 'Recorded: `evidence_id`, `item_id`, `correct`.' }
        '401': { description: 'No verified session.' }
        '404': { description: 'No such servable `(set_id, version)` pair.' }
        '422': { description: '`invalid_version`, `invalid_item`, `invalid_answer`, `invalid_latency`, `unknown_item` or `unknown_field`.' }
        '503': { description: 'Practice port not wired (`practice_unavailable`).' }

  /api/v1/attempts:
    get:
      tags: [attempts]
      summary: Discover saved drafts, pending work and completed feedback
      description: |
        Owner-scoped, newest first, excluding deleted attempts. Carries no draft or submission text.
        Each summary contains id, task_id, task_version, rubric_id, rubric_version, topic,
        parent_submission_id, revision, created_at, submission_id (nullable), and status
        (draft, pending, unassessed, assessed). Use submission_id to reopen the exact result.
        The existing open=1 query returns unfinished drafts only.
      parameters:
        - $ref: '#/components/parameters/PreparationQuery'
        - name: open
          in: query
          schema: { type: string, enum: ['1'] }
      responses:
        '200':
          description: A summary index under the attempts key.
          content:
            application/json:
              schema:
                type: object
                properties:
                  attempts:
                    type: array
                    items: { $ref: '#/components/schemas/AttemptSummary' }
        '401': { description: 'No verified session.' }
        '422': { description: 'Unsupported filter (`invalid_query`).' }
    post:
      tags: [attempts]
      summary: Create an owned attempt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                preparationId: { type: string, format: uuid, description: 'EXAM-S1. Required for a new attempt. A revision inherits its parent''s preparation; naming a different one is `422 preparation_mismatch`.' }
                parentSubmissionId: { type: string, format: uuid, description: 'Revision parent. Inherits its exact task/rubric and frozen text when binding is omitted.' }
                taskId: { type: string }
                taskVersion: { type: string }
                rubricId: { type: string }
                rubricVersion: { type: string }
      responses:
        '201': { description: 'Created at revision 1 with text, immutable task/rubric binding and parent_submission_id. Explicit binding requires all four fields.' }
        '404': { description: 'The parent is not this owner’s (`not_found`).' }
        '422': { description: 'Invalid binding, parent_binding_mismatch, or task_not_servable: the exact task AND its declared rubric must both be servable under the deployment content mode and rights policy. Submit and retry apply the same rule; saved history stays readable.' }

  /api/v1/export:
    get:
      tags: [account]
      summary: Export the signed-in learner's saved work
      description: |
        JSON format hatoove-learner-export-v1, with exported_at, settings, attempts (including
        draft text), submissions (immutable text snapshots), results (job status and feedback),
        and objective_evidence (the learner's answers). Excludes deleted attempts, other accounts,
        passwords, sessions, reset/verification tokens, worker leases and objective answer keys.
        Historical owned work is retained even when its content is no longer offered for new use.
      responses:
        '200': { description: 'The owner-scoped export document.' }
        '401': { description: 'No verified session.' }
        '503': { description: 'Required export/settings port unavailable.' }

  /api/v1/attempts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [attempts]
      summary: Read an owned attempt and its draft
      responses:
        '200': { description: 'The attempt and owned draft. Historical task/rubric payloads follow catalogue and rights policy; blocked_reason explains withheld content while the learner text remains available.' }
        '404': { description: 'Not this owner’s — never 403, so another owner’s record is indistinguishable from one that does not exist.' }
    put:
      tags: [attempts]
      summary: Save the draft
      description: The revision fence. A stale save is refused with `409 stale_revision` rather than overwriting the learner's text.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedRevision, text]
              properties:
                expectedRevision: { type: integer }
                text: { type: string, maxLength: 12000 }
      responses:
        '200': { description: 'Saved; the new revision is returned.' }
        '409': { description: 'Stale revision (`stale_revision`).' }
    delete:
      tags: [attempts]
      summary: Discard an owned unsubmitted draft
      responses:
        '200': { description: 'Unsubmitted draft tombstoned.' }
        '409': { description: 'Submitted writing is preserved (`submitted_attempt`); an attached active-run draft must be managed through its run. A stale account precondition returns `account_changed`.' }

  /api/v1/attempts/{id}/submissions:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [attempts]
      summary: Submit for feedback
      description: Idempotent by `eventId` — a duplicate click replays the first submission rather than queueing a second, so there is exactly one debit. An attached active-run attempt must use mock-run finalisation; this standalone route refuses it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedRevision, eventId]
              properties:
                expectedRevision: { type: integer }
                eventId: { type: string, format: uuid }
      responses:
        '202': { description: 'Queued for the worker.' }
        '409': { description: '`draft_conflict`, `idempotency_conflict`, `already_submitted` or `allowance_exhausted`.' }
        '422': { description: 'Empty submission (`empty_submission`).' }

  /api/v1/submissions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [attempts]
      summary: Read a submission, its job and its assessment
      description: A missing or failed assessment is reported as such. It is never a fabricated score.
      responses:
        '200': { description: 'Submission, job status, assessment (or null), exact task/rubric identifiers and parent_submission_id. Historical task/rubric payloads and feedback follow catalogue and rights policy; blocked_reason explains withheld content while original submitted text is retained.' }
        '404': { description: 'Not this owner’s.' }

  /api/v1/submissions/{id}/retry:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [attempts]
      summary: Retry a failed assessment
      responses:
        '202': { description: 'Requeued.' }
        '409': { description: 'Not retryable (`retry_unavailable`) — the job is not failed, has exhausted its tries, or is already exhausted.' }

  # /api/progress REMOVED 2 October 2026. It was documented here as a retired-but-PRESENT route; it is
  # now an ABSENT one. The handlers, the `x-b1prep-account` selector, the `.rev` marker and the file
  # writes are deleted from `server.js`, and `tools/retired-surface-check.mjs` is the negative check that
  # keeps them gone. Its absence is asserted twice: 404 to an AUTHENTICATED caller in
  # `tools/docker-stack-check.mjs`, and "no handler, no refusal code, no file opened" in the negative
  # check. Documenting a deleted route is how one comes back.

  # /api/config AND /api/ai REMOVED 2 October 2026 (SPA-RETIRE 6). Both were documented here as
  # retired-but-PRESENT and auth-wrapped; both are now DELETED from `server.js`. `/api/config` read and
  # wrote a MACHINE-GLOBAL `EXAM_DATE` for every visitor with no identity, and kept a local single-user
  # install alive; `/api/ai` (with its operator-only diagnostic `/api/ai/test`) let a browser spend the
  # operator's provider credits. The learner's exam date is `GET/PUT /api/v1/settings`, per account; the
  # provider is operator environment configuration that no route sets or reports; and inference is a
  # server-side worker job. Their absence is asserted three ways: no handler literal and no
  # `provider_config_is_operator_only` token in `tools/retired-surface-check.mjs` (legs R8/R9), 404 to an
  # AUTHENTICATED caller in `tools/docker-stack-check.mjs`, and "no path key declared, and the removal
  # RECORDED" in `tools/api-spec-check.mjs` (`S-absent` / `S-recorded`).

  /api/v1/checkout/offer:
    get:
      tags: [payments]
      summary: List configured markets or read the selected exam offer
      description: Optional off-by-default test payments. No normal installation seeds commercial offers. Omitted market returns choices and a null offer.
      parameters:
        - { in: query, name: exam, required: true, schema: { type: string } }
        - { in: query, name: market, schema: { type: string, pattern: '^[A-Z]{2}$' } }
      responses:
        '200': { description: Configured markets and optional offer with testMode true }
        '401': { description: Verified session required }
        '404': { description: No configured offer for this available exam and market }
        '503': { description: Payments unavailable }
  /api/v1/checkout/session:
    post:
      tags: [payments]
      summary: Reserve an owned order and create or resume its test checkout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [examId, market, eventId]
              properties:
                examId: { type: string }
                market: { type: string, pattern: '^[A-Z]{2}$' }
                eventId: { type: string, format: uuid }
      responses:
        '201': { description: 'Owned orderId, allowed checkoutUrl, expiresAt and testMode true. Terminal replay returns the same orderId with status and null checkoutUrl; the client must read the owned order before confirming payment.' }
        '401': { description: Verified session required }
        '409': { description: Already entitled, conflicting event, pending different market or expired checkout }
        '422': { description: Invalid or unexpected field }
        '502': { description: Uncertain provider outcome; retry the same event and order }
        '503': { description: Payments unavailable }
  /api/v1/orders/{orderId}:
    get:
      tags: [payments]
      summary: Read the authenticated learner's order and entitlement
      parameters:
        - { in: path, name: orderId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Owned order status and entitlement; provider return is not payment proof }
        '401': { description: Verified session required }
        '404': { description: Absent order or another owner's order }
  /api/v1/payments/stripe/webhook:
    post:
      tags: [payments]
      summary: Verify a test Stripe event and atomically record its disposition
      security: []
      description: Only this exact POST has a signature-based boundary instead of a session and Origin. Verify exact bounded raw bytes before parsing. Missing mappings and persistence failures remain retryable.
      parameters:
        - { in: header, name: Stripe-Signature, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: Durable disposition, including a duplicate or irrelevant event }
        '400': { description: Invalid signature or provider payload }
        '413': { description: Body too large }
        '503': { description: Payments unavailable or event needs a retry }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: hatoove_owned_session
      description: |
        The server-side session. `HttpOnly`, `SameSite=Lax`; `Secure` is a TLS-deployment switch and
        is deliberately not required on the local HTTP stack, where a `Secure` cookie would never be
        sent.
  parameters:
    PreparationQuery:
      name: preparationId
      in: query
      required: true
      schema: { type: string, format: uuid }
      description: 'EXAM-S1. The preparation this read is scoped to. Missing/malformed `422`; foreign/absent `404`. A retained `exam` query may only restate its exam (`422 preparation_mismatch`).'
  schemas:
    MockForm:
      type: object
      properties:
        exam_id: { type: string }
        release_version: { type: string }
        blueprint_version: { type: string }
        form_id: { type: string }
        version: { type: string }
        title: { type: string }
        scope: { type: string, enum: [section] }
        sections: { type: array, items: { type: string } }
        mode: { type: string, enum: [untimed, timed] }
        attempt_mode: { type: string, enum: [practice, mock] }
        time_limit_seconds: { type: integer, nullable: true }
        item_count: { type: integer }
        writing_choice_count: { type: integer, minimum: 0, maximum: 1 }
        review_status: { type: string }
        release_state: { type: string, enum: [hidden, internal, available, withdrawn] }
    MockPosition:
      type: object
      additionalProperties: false
      required: [member, item]
      properties:
        member: { type: integer, minimum: 0 }
        item: { type: integer, minimum: 0 }
    MockResponse:
      type: object
      additionalProperties: false
      required: [setId, version, itemId, answer]
      properties:
        setId: { type: string }
        version: { type: string }
        itemId: { type: string }
        answer: { type: string, nullable: true }
    Playback:
      type: object
      properties:
        media_id: { type: string }
        media_version: { type: string }
        revision: { type: integer, minimum: 0 }
        state: { type: string, enum: [ready, playing, paused, completed] }
        plays_used: { type: integer, minimum: 0 }
        max_plays: { type: integer, minimum: 1 }
        position_ms: { type: integer, minimum: 0 }
        duration_ms: { type: integer, minimum: 1 }
        playback_id: { type: string, format: uuid, nullable: true }
        uncertain: { type: boolean }
        server_now: { type: string, format: date-time }
    Recording:
      type: object
      properties:
        id: { type: string }
        media_id: { type: string }
        media_version: { type: string }
        label: { type: string }
        duration_ms: { type: integer, minimum: 1 }
        mime_type: { type: string, enum: [audio/wav] }
        max_plays: { type: integer, minimum: 1 }
    MockRunSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        preparation_id: { type: string, format: uuid }
        exam_id: { type: string }
        release_version: { type: string }
        release_state: { type: string, enum: [hidden, internal, available, withdrawn] }
        review_status: { type: string }
        blueprint_version: { type: string }
        form_id: { type: string }
        form_version: { type: string }
        title: { type: string }
        scope: { type: string, enum: [section] }
        mode: { type: string, enum: [untimed, timed] }
        attempt_mode: { type: string, enum: [practice, mock], nullable: true }
        state: { type: string, enum: [active, finalised] }
        revision: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deadline_at: { type: string, format: date-time, nullable: true }
        finalised_at: { type: string, format: date-time, nullable: true }
        server_now: { type: string, format: date-time }
        expired: { type: boolean }
        writing: { $ref: '#/components/schemas/MockWriting' }
        blocked_reason:
          type: string
          nullable: true
          description: 'A blocked run retains owned identity and responses. rights_blocked, content_policy_blocked or exam_unavailable withhold members and protected results; ordinary withdrawal of an available release retains permitted resume.'
    MockRun:
      allOf:
        - $ref: '#/components/schemas/MockRunSummary'
        - type: object
          properties:
            responses: { type: array, items: { $ref: '#/components/schemas/MockResponse' } }
            position: { $ref: '#/components/schemas/MockPosition' }
            writing_choices:
              type: array
              description: Exact pinned A/B prompts, withheld when content is blocked. No assessment is implied by selection.
              items:
                type: object
                properties:
                  id: { type: string }
                  section: { type: string }
                  options:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, enum: [A, B] }
                        task: { $ref: '#/components/schemas/TaskVersion' }
            members:
              type: array
              description: Exact pinned public content, or empty when access is blocked. Contains no keys or explanations.
              items:
                type: object
                properties:
                  set_id: { type: string }
                  version: { type: string }
                  interaction: { type: string, enum: [matching_headlines, single_choice, matching_ads, gap_choice, gap_bank, grouped_choice, fixed_audio] }
                  review_status: { type: string }
                  item_count: { type: integer }
                  recordings: { type: array, items: { $ref: '#/components/schemas/Recording' } }
                  title: { type: string }
                  family: { type: string }
                  section: { type: string }
                  part: { type: integer }
                  payload: { type: object }
            result:
              type: object
              nullable: true
              description: Null while active, blocked, or in a writing-only run. Objective counts describe this section practice only; writing has its own assessment state.
              properties:
                answered: { type: integer }
                unanswered: { type: integer }
                correct: { type: integer }
                total: { type: integer }
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      set_id: { type: string }
                      version: { type: string }
                      item_id: { type: string }
                      answer: { type: string, nullable: true }
                      correct: { type: boolean }
                      unanswered: { type: boolean }
                      correct_answer: { type: string }
                      explanation: { type: string, nullable: true }
    MockWriting:
      type: object
      nullable: true
      description: The original writing attachment remains immutable when independent revisions are created. Null means no option was selected.
      properties:
        choice_group_id: { type: string }
        selected_option_id: { type: string, enum: [A, B] }
        attempt_id: { type: string, format: uuid }
        draft_revision: { type: integer, minimum: 1 }
        submission_id: { type: string, format: uuid, nullable: true }
        assessment_state: { type: string, enum: [not_started, pending, assessed, failed, unassessed] }
        failure_code: { type: string, nullable: true }
    Preparation:
      type: object
      required: [id, exam_id, exam, exam_language, exam_date, state, revision, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        exam_id: { type: string }
        exam: { type: string }
        exam_language: { type: string }
        exam_date: { type: string, format: date, nullable: true }
        state: { type: string, enum: [active, archived] }
        revision: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AttemptSummary:
      type: object
      required: [id, task_id, task_version, rubric_id, rubric_version, revision, created_at]
      properties:
        id: { type: string, format: uuid }
        preparation_id: { type: string, format: uuid, nullable: true }
        exam_id: { type: string, nullable: true }
        task_id: { type: string }
        task_version: { type: string }
        rubric_id: { type: string }
        rubric_version: { type: string }
        topic: { type: string }
        parent_submission_id: { type: string, format: uuid, nullable: true }
        mock_run_id: { type: string, format: uuid, nullable: true, description: Initial run attachment only; a revision is an independent attempt. }
        revision: { type: integer }
        created_at: { type: string, format: date-time }
        submission_id: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [draft, pending, unassessed, assessed] }
    TaskVersion:
      type: object
      description: One servable version of a task, with the truth about its review and rights status.
      properties:
        task_id: { type: string }
        version: { type: string }
        exam_id: { type: string }
        family: { type: string }
        register: { type: string }
        topic: { type: string }
        situation: { type: string }
        adressat: { type: string }
        leitpunkte: { type: array, items: { type: string } }
        rubric_id: { type: string }
        rubric_version: { type: string }
        review_status: { type: string, enum: [unreviewed, approved, rejected] }
        rights_status: { type: string, description: 'Effective append-only rights decision, falling back to the immutable content row. Defaults to serving generated; B1PREP_SERVE_RIGHTS may allow generated/licensed/commissioned. Unknown always fails closed.' }

security:
  - sessionCookie: []
