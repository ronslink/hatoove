# DOCKER-ONLY-01 — the server stack; Docker Compose is the supported launcher.
#
#   docker compose up -d --build      bring the whole server up
#   docker compose ps                 see it
#   docker compose logs -f app        follow the API
#   docker compose down               stop it (keep the database)
# Database volumes are retained by down. Removing them is a separate data-deletion action.
#
# The whole product runs in containers. The host needs Docker and nothing else — no Node install,
# no `npm install`, no "works on my machine". That is the difference between a local single-user
# program and a local server.
#
# Shape: db (healthy) -> migrate (runs once, exits) -> app + worker.
# The runtime never migrates: a web process holding migration credentials is the wrong shape, and a
# runtime that migrates at start hides a schema that is behind. `migrate` is the only thing that
# changes the schema and it must SUCCEED before either long-running service starts.
#
# Ports are published on 127.0.0.1 only, and are parameterised so a check can run a disposable
# stack beside the real one without a collision.

name: hatoove

x-ownapi-env: &ownapi-env
  OWNAPI_PG_HOST: db
  OWNAPI_PG_PORT: "5432"
  OWNAPI_PG_DATABASE: hatoove
  OWNAPI_PG_USER: postgres
  OWNAPI_PG_SCHEMA: hatoove
  OWNAPI_PG_ROLE_PREFIX: hatoove
  # The local pilot intentionally exposes labelled unreviewed practice. Standalone server policy
  # defaults to public/approved-only; make this local preview choice explicit for app and worker.
  B1PREP_CONTENT_MODE: "${HATOVE_CONTENT_MODE:-internal-preview}"

# MEDIA-MOUNT-01 (FIX-F2) — the listening recordings are TRACKED, and this mount is an OPT-IN override.
#
# A12(1), decided by Ron on 5 Oct 2026: the nine telc B1 recordings are tracked PLAIN in this repository under
# `content/exams/telc-deutsch-b1/audio/` (43.89 MB total, sha256-matching the package's `media` rows), so
# `COPY content/exams/` puts them in the image and a clean clone works with NO environment variable and NO host
# folder. The default source below is therefore that same tracked tree, not an untracked host directory: a
# first `docker compose up --build` cannot be stopped by a media directory that does not exist.
#
# The mount exists so an operator can supply audio WITHOUT rebuilding — POOL-01's new HV sets, a re-recording,
# or object storage staged to disk:
#   HATOVE_AUDIO_ROOT=/srv/hatoove/media docker compose up -d --build
# The directory must mirror the inside of `content/exams/`, i.e. `<HATOVE_AUDIO_ROOT>/telc-deutsch-b1/audio/…`.
# `server/media-contract.mjs` reads `B1PREP_MEDIA_ROOT` (defaulted to the mount target below); when an operator
# sets `HATOVE_AUDIO_ROOT` to a directory that is incomplete, the `media` preflight FAILS LOUDLY naming every
# missing file — that is the point of the override, and it never applies to the default path.
#
# `create_host_path: false` is belt-and-braces, NOT the guard. MEASURED on Windows + Docker Desktop: a typo'd
# or empty HATOVE_AUDIO_ROOT was still CREATED by the daemon, so this option did not stop `up` — the failure
# came from the `media` preflight, which named every missing file, and from `app`'s
# `depends_on: media: service_completed_successfully`, which held the API at `Created` with health unreachable
# instead of letting it serve nothing. (On Linux the daemon may resolve the source differently and refuse it
# earlier; that is UNMEASURED here, so the guarantees relied on are the preflight and the dependency chain, and
# the empty-override case is HARMLESS rather than impossible.) The default source is tracked, so it always
# exists in a checkout.
x-media-mount: &media-mount
  type: bind
  source: "${HATOVE_AUDIO_ROOT:-./content/exams}"
  target: /app/media
  read_only: true
  bind:
    create_host_path: false

services:
  db:
    image: postgres:17-alpine
    # Loopback trust is correct HERE and nowhere else: the container is not published beyond
    # 127.0.0.1 and hosts no real data. This is a local installation, not a deployment.
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: hatoove
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hatoove"]
      interval: 3s
      timeout: 3s
      retries: 40
    ports:
      - "127.0.0.1:${HATOVE_DB_PORT:-55440}:5432"
    restart: unless-stopped

  # Applies the frozen migrations, then exits. `OWNAPI_PG_ALLOW=1` is required by the command itself
  # so it can never be pointed at a database by accident; it name refusals `postgres`/`template*`.
  # The media mount is here too: `tools/import-exam-package.mjs` reads and checksums every referenced
  # recording while it imports a package, and an operator runs it through this service.
  migrate:
    build: .
    command: ["node", "server/migrate.mjs"]
    volumes: [*media-mount]
    environment:
      <<: *ownapi-env
      OWNAPI_PG_ALLOW: "1"
      B1PREP_MEDIA_ROOT: "${HATOVE_MEDIA_ROOT:-/app/media}"
      OWNAPI_PG_PAYMENTS_PASSWORD: "${OWNAPI_PG_PAYMENTS_PASSWORD:-}"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # MEDIA-MOUNT-01 — THE STARTUP SIGNAL. A missing referenced recording must fail the stack that names it,
  # not answer 404 when a learner presses play. This one-shot service runs the shipped reader over every
  # recording the tracked packages reference and exits non-zero if ANY is missing; `app` waits for it, so
  # `docker compose up` stops with the missing file named in the log before the API ever listens.
  media:
    build: .
    command: ["node", "tools/media-mount-check.mjs", "--require-recordings"]
    volumes: [*media-mount]
    environment:
      B1PREP_MEDIA_ROOT: "${HATOVE_MEDIA_ROOT:-/app/media}"
    restart: "no"

  app:
    build: .
    command: ["node", "server.js"]
    volumes: [*media-mount]
    environment:
      <<: *ownapi-env
      B1PREP_SAAS: "1"
      B1PREP_ACCOUNTS: "1"
      B1PREP_PORT: "4321"
      # A container that binds its own loopback is unreachable through a published port, so the
      # server must bind 0.0.0.0. The publish address above still keeps it on 127.0.0.1.
      B1PREP_BIND: "0.0.0.0"
      # The origin gate refuses mutating /api/* requests that do not match the deployment's own
      # public origin. Without this, sign-up answers 403 origin_rejected and NOTHING works for a
      # learner - measured, not assumed. It must match the address the browser actually uses.
      B1PREP_PUBLIC_ORIGIN: "${HATOVE_PUBLIC_ORIGIN:-http://localhost:4300}"
      # Optional test payments; no offers are seeded and the default refuses purchases.
      B1PREP_MEDIA_ROOT: "${HATOVE_MEDIA_ROOT:-/app/media}"
      PAYMENTS_MODE: "${HATOVE_PAYMENTS_MODE:-off}"
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-}"
      OWNAPI_PG_PAYMENTS_PASSWORD: "${OWNAPI_PG_PAYMENTS_PASSWORD:-}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      # No recording, no API: the preflight above must have named every file it could not read.
      media:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${HATOVE_APP_PORT:-4300}:4321"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4321/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      start_period: 20s
      retries: 6
    restart: unless-stopped

  # The worker is a separate container on purpose: the runtime must not carry the worker's
  # privileges, and it connects with the restricted `<prefix>_worker` role. No model provider is
  # called - the grader is the deterministic stub until PILOT-06 injects a real one.
  # MEDIA-MOUNT-01 RESIDUAL: this service depends only on `migrate`, so it still STARTS when the `media`
  # preflight fails. Harmless while the worker grades text and never reads a recording — but if it ever
  # touches audio or serves media, give it the same `depends_on: media: service_completed_successfully`
  # gate and the media mount, or the gap becomes visible only at a learner's play.
  worker:
    build: .
    command: ["node", "server/worker.mjs"]
    environment: *ownapi-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  db-data:
