name: Offline checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  baseline:
    name: Offline baseline (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Check tracked source and excluded data
        run: node tools/repository-check.mjs
      - name: Legacy offline baseline
        run: node tools/check.js
      - name: Writing regression checks
        run: node tools/writing-check.js
      - name: Feedback regression checks
        run: node tools/feedback-check.js
