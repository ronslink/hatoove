name: Offline checks
#
# VALIDATE THIS FILE BEFORE PUSHING IT. Nothing in this repository parses YAML — `repository-check.mjs` is
# deliberately dependency-free, and adding a parser to the root package would break the `"dependencies": {}`
# property this project keeps on purpose. The consequence was measured on 2 October 2026: the new `rendered`
# job contained `- name: The real stack: migrations, ...`, and an UNQUOTED COLON-SPACE inside a plain scalar
# made the whole workflow INVALID YAML. Every job would have failed to start, and READING the file did not show
# it — the error was visible only to a parser:
#
#   docker run --rm -i mikefarah/yq:4 -o=json '.jobs | keys' - < .github/workflows/ci.yml
#
# (That is what found it: L219.C29 "mapping values are not allowed in this context". Two step names were
# reformatted to avoid the colon. `repository-check.mjs` now asserts that every `node tools/….mjs` a workflow
# names is a TRACKED file, which catches the other half of this class — a step that outlives its script.)
on:
  pull_request:
  push:
    branches: [main]
  # The rendered gate is the only browser job and runs on a schedule rather than on every push.
  # The required PostgreSQL job also uses Docker for its isolated certificate-verification fixture.
  # Keeping the longer rendered suite scheduled avoids charging its full run time to every change.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    name: Offline baseline (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Check tracked source and excluded data
        run: node tools/repository-check.mjs
      # THE WORKFLOW-SHAPE CHECK CAN FAIL, and each of its rules has a mutation that proves it. This runs
      # beside the table-class mutations for the same reason: a structural check whose failure modes are not
      # demonstrated is decoration, and this one already had a version that reported nothing at all because it
      # called `fs` in a file that imports no `fs`, with a `catch` that swallowed the ReferenceError.
      - name: The workflow-shape check detects every mutation it claims to
        run: node --test tools/workflow-shape.test.mjs
      # DESIGN-LANGUAGE.md: no raw colour or font family in a rule, the required tokens present,
      # the dark override present, the mobile breakpoints and reduced motion honoured, every view
      # registered through the shell. The selected-language interface has focused checks below. This gate
      # WAS red on a false count - the original regex matched the rules that already said var(--serif)
      # plus the @font-face descriptors, which cannot use var() at all; the true count was zero. It is
      # green now and the check fails on a genuinely raw family, verified by reintroducing one.
      - name: Design language consistency
        run: node tools/design-check.mjs
      - name: Production deployment source boundaries
        run: node tools/production-compose-check.mjs
      # Not PostgreSQL-backed, so they belong on both OSes with the rest of the offline set.
      # THE NEGATIVE CHECK FOR THE RETIRED FILE STORE. `progress-scope-check` used to sit here and is
      # gone with the route it drove (see work/implementation/RETIRED-CHECKS.md); this is its
      # replacement vehicle: no `/api/progress` handler, no refusal code, no progress file opened, no
      # server-side import of the merge module, and no path to it in the shipped client. The
      # client-side half of that property — no learner state in web storage — is a leg of
      # tools/app-browser-check.mjs, which needs Docker and a browser and is not a runner gate.
      - name: The retired single-user store cannot come back
        run: node tools/retired-surface-check.mjs
      # THE FRONT DOOR MUST STAY CRAWLABLE, CANONICAL AND HONEST, and this step exists because two
      # real failures got through without it. `robots.txt` and `sitemap.xml` are new ROOT files, and
      # the static gate only serves files listed in `PUBLIC_FILES` - so an unlisted robots.txt answers
      # 302/401, which Google reads as "do not crawl this host", and an unfetchable sitemap is never
      # used. Separately, `core.js#initialLocale()` falls back to `navigator.languages`, and Googlebot
      # reports `en-US`: the German canonical page was rendered and indexed as English with
      # `<html lang="en">`. The check also holds the canonical, the Open Graph/Twitter set (whose image
      # file must exist), the JSON-LD FAQ word-for-word against the visible FAQ, and the absence of
      # rich-result types this product cannot substantiate. Offline: no database, no provider, no
      # network - it boots the server only to prove the crawler files are public WITHOUT a session.
      - name: SEO surface (crawlability, canonical, structured data)
        run: node tools/seo-check.mjs
      # "The provider is operator-only and invisible" USED to run here
      # (tools/provider-config-check.mjs). That check drove `/api/config` anonymously, which the auth
      # wrap now refuses with 401 before any handler — so it had been red since that wrap landed, and
      # CI never showed it because the step behind a failing one is skipped. Its property moved to
      # checks that can actually observe it: `tools/owned-api-check.mjs` leg
      # `model-is-not-a-learner-setting` (the server refuses `model` in both request shapes, with a
      # measured discrimination test) and `tools/app-browser-check.mjs` leg L31 (the settings screen
      # offers no provider, key or model field). Row in work/implementation/RETIRED-CHECKS.md.
  contracts:
    name: Server and owned API contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      # Full history: keymask --prefix-commit materializes the pre-fix tree with
      # `git show <sha>:<file>` and fails on a shallow clone. (revision-check and
      # progress-equal-check used to need it too; both are retired with the file store.)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Same-origin guard on state-changing routes
        run: node tools/server-origin-check.mjs
      - name: Key never disclosed by any route
        run: node tools/keymask-check.mjs
      - name: Key masking discriminates against the pre-fix server
        run: node tools/keymask-check.mjs --prefix-commit 8a71f718ee534851a98d19eece07dab933b56479
      - name: Owned API suite (memory backend)
        run: node tools/owned-api-check.mjs
      - name: Owned API client contract
        run: node tools/owned-client-check.mjs
      - name: Exact objective versions at the browser boundary
        run: node tools/exam-s0-client-check.mjs
      - name: Explicit preparation transport and stale response fences
        run: node tools/exam-s1-client-check.mjs
      - name: Preparation API and exam-scoped contract refusals
        run: node tools/exam-s1-server-check.mjs
      - name: Package source and publication validation
        run: node tools/exam-s2-package-check.mjs
      - name: Saved section API and strict request contracts
        run: node tools/exam-s2-runs-check.mjs
      - name: Saved section client retries and recovery
        run: node tools/exam-s2-client-check.mjs
      - name: Internal grouped reading package and request contracts
        run: node tools/exam-s3-check.mjs
      - name: Grouped reading client and explicit exam choice
        run: node tools/exam-s3-client-check.mjs
      - name: DTZ writing package, policy and transport contracts
        run: node tools/exam-s4-check.mjs
      - name: DTZ writing choice and recovery client contracts
        run: node tools/exam-s4-client-check.mjs
      - name: Fixed listening package and private media integrity
        run: node tools/exam-s5-package-check.mjs
      - name: Durable playback and protected byte range contracts
        run: node tools/exam-s5-media-check.mjs
      - name: Listening client loading and interrupted-play recovery
        run: node tools/exam-s5-client-check.mjs
      - name: Complete written mock package, timing and assigned client contracts
        run: |
          node tools/exam-s5b-package-check.mjs
          node tools/exam-s5b-backend-check.mjs
          node tools/exam-s5b-client-check.mjs
      - name: Complete DTZ admission policy and wrapper refusals
        run: node tools/exam-s6-core-check.mjs
      - name: Private content review input and packet boundaries
        run: node tools/content-review-check.mjs
      - name: Exact shared explanation review input and operator boundaries
        run: node tools/explanation-review-check.mjs
      - name: Saved explanation provenance language and read-only client contracts
        run: |
          node tools/explanation-check.mjs
          node tools/explanation-worker-check.mjs
          node tools/explanation-api-check.mjs
          node tools/explanation-client-check.mjs
      - name: Interface languages and public shell practice state preservation
        run: |
          node tools/i18n-core-check.mjs
          node tools/public-locale-check.mjs
          node tools/shell-locale-check.mjs
          node tools/practice-locale-check.mjs
      - name: Install locked PostgreSQL client for offline worker CLI contracts
        run: npm ci --prefix server/owned-postgres --ignore-scripts --no-audit --no-fund
      - name: PostgreSQL transport secrets and connection budgets without a service
        run: node tools/postgres-config-check.mjs
      - name: Trusted public origin and secure session cookie lifecycle without a service
        run: node tools/session-cookie-check.mjs
      - name: Private invocation receipts and exact synthetic cost contracts
        run: node tools/provider-attempt-check.mjs
      - name: Payment signatures, test provider and activation refusals
        run: node tools/payment-path-check.mjs
      - name: Payment API ownership and exact webhook boundary
        run: node tools/payments-api-check.mjs
      - name: Checkout market selection, safe redirects and recovery
        run: node tools/payment-client-check.mjs
      - name: Readiness follows database availability and recovers
        run: node tools/readiness-check.mjs
      - name: Public content policy and criterion-specific feedback contracts
        run: node tools/exam-s0-server-check.mjs
      - name: Stale tabs cannot follow another account cookie
        run: node tools/account-context-check.mjs
      - name: Read aloud uses explicit matching local voices
        run: node tools/read-aloud-check.mjs
      - name: Submitted writing and retained export data survive stale draft deletion
        run: node tools/submission-preservation-check.mjs
      - name: Saved writing history export and revision contracts
        run: node tools/learner-history-check.mjs
      - name: Conservative sentence hints and recovered source identities
        run: node tools/sentence-building-check.mjs
      - name: Reference guides preserve correct and incorrect example semantics
        run: node tools/guide-render-check.mjs
  # THE DURABLE CLAIMS WERE UNGATED, and that is what this job fixes. Until now CI had NO PostgreSQL
  # service at all, so the persistent installation, the mounted account API, the account-scoped
  # settings, the runtime refusals, the session boundary and the account deletion were all verified
  # only by hand, in one session, on one machine - and an ungated check rots. This is also the ONLY
  # gate that can prove the durable properties: a memory backend cannot show that a draft survives a
  # server restart.
  #
  # ubuntu only, deliberately: a GitHub service container is a Linux container, and the point here is
  # real PostgreSQL, not a second OS. The offline set above still runs on both.
  postgres:
    name: Durable and hosted runtime contracts (real PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hatoove_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        # Without this the first step races the database's own startup and fails intermittently,
        # which is the worst kind of gate: one that fails for a reason unrelated to the change.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OWNAPI_PG_HOST: 127.0.0.1
      OWNAPI_PG_PORT: '5432'
      OWNAPI_PG_DATABASE: hatoove_ci
      OWNAPI_PG_SCHEMA: hatoove
      OWNAPI_PG_USER: postgres
      # The provisioning check deliberately refuses to create schema and roles without this explicit
      # confirmation, so that nobody points it at a real database by accident. The service container
      # above IS disposable, which is exactly what this flag is asking about.
      OWNAPI_PG_ALLOW: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install the PostgreSQL client the owned server uses
        run: npm ci --prefix server/owned-postgres --ignore-scripts --no-audit --no-fund
      - name: Local Docker and Compose are available for isolated hosting checks
        timeout-minutes: 2
        run: |
          docker --host unix:///var/run/docker.sock version
          docker compose version
      # The configuration under test must be rendered by the same Compose release the
      # droplet deploys with. tools/install-pinned-compose.sh installs the verified
      # release everywhere docker resolves plugins from, including the system directory
      # that the checker's isolated HOME and DOCKER_CONFIG fall through to.
      - name: Pin the reviewed Compose plugin version
        timeout-minutes: 3
        run: bash tools/install-pinned-compose.sh
      - name: Production Compose variants render with synthetic configuration only
        timeout-minutes: 2
        run: node tools/production-compose-check.mjs --compose
      - name: Fetch the declared disposable TLS fixture images
        timeout-minutes: 5
        run: |
          docker --host unix:///var/run/docker.sock pull node:22-bookworm
          docker --host unix:///var/run/docker.sock pull postgres:17-alpine
      # This checker pins a validated local Docker socket and allocates a separate dynamic loopback
      # port/database. It must never use the existing Actions PostgreSQL service on port 5432.
      - name: PostgreSQL certificates and host identities are verified by actual connections
        timeout-minutes: 8
        run: node tools/postgres-tls-check.mjs --run-disposable
      - name: Persistent installation is idempotent and a draft survives re-provisioning
        run: node tools/postgres-provision-check.mjs
      - name: Migration line-ending upgrades preserve recorded checksums and reject SQL edits
        run: node tools/migration-eol-check.mjs --postgres
      - name: The account API over real HTTP, including the restart property
        run: node tools/accounts-http-check.mjs
      - name: The owned API on the persistent backend
        run: node tools/owned-api-check.mjs --backend=postgres-persistent
      - name: Submitted writing survives real concurrent discard and exports retained history
        run: node tools/submission-preservation-pg-check.mjs
      # The suite above resets the GLOBAL sign-up bucket per world; this proves the throttle still
      # refuses inside a world and that, without the reset, the exhaustion would be inherited.
      - name: The sign-up throttle is enforced per world and not accumulated across worlds
        run: node tools/owned-api-throttle-isolation-check.mjs
      - name: Account deletion removes every row and is one transaction
        run: node tools/deletion-check.mjs
      - name: The worker runner claims, fences, retries and reclaims (stub grader; no provider call)
        run: node tools/worker-runner-check.mjs
      - name: Version-specific evidence and public content gates on real PostgreSQL
        run: node tools/exam-s0-server-pg-check.mjs
      - name: Preparation migration registration and credit concurrency on PostgreSQL
        run: node tools/exam-s1-server-pg-check.mjs
      - name: Atomic registration language and concurrent account preferences
        run: node tools/registration-language-pg-check.mjs
      - name: Pilot account requests, their operator command and their table class on PostgreSQL
        run: node tools/pilot-access-pg-check.mjs
      - name: Package imports and release access on PostgreSQL
        run: node tools/exam-s2-package-pg-check.mjs
      - name: Saved section ownership and concurrent finalisation on PostgreSQL
        run: node tools/exam-s2-runs-pg-check.mjs
      - name: Internal DTZ reading and exact grouped marking on PostgreSQL
        run: node tools/exam-s3-pg-check.mjs
      - name: DTZ writing choice, lifecycle and exam-credit PostgreSQL contract
        run: node tools/exam-s4-pg-check.mjs
      - name: Exact media publication and immutable private assets
        run: node tools/exam-s5-package-pg-check.mjs
      - name: Owned playback concurrency, recovery and deletion
        run: node tools/exam-s5-media-pg-check.mjs
      - name: Complete written mocks, immutable timing and rights-fenced grading
        run: |
          node tools/exam-s5b-package-pg-check.mjs
          node tools/exam-s5b-backend-pg-check.mjs
          node tools/exam-s5b-worker-check.mjs
      - name: Complete DTZ admission, payload parity and pinned continuations
        run: |
          node tools/exam-s6-core-pg-check.mjs
          node tools/exam-s6-parity-pg-check.mjs
          node tools/exam-s6-admission-pg-check.mjs
          node tools/exam-s6-payments-pg-check.mjs
      - name: Attributable content review and concurrent learner refusals
        run: |
          node tools/content-review-pg-check.mjs
          node tools/content-review-admission-pg-check.mjs
          node tools/content-review-fixture-check.mjs
      - name: Payment upgrade, ownership, concurrent grants and expiry
        run: node tools/payments-pg-check.mjs
      - name: Saved explanation ownership atomicity export and deletion
        run: |
          node tools/explanation-review-pg-check.mjs
          node tools/explanation-pg-check.mjs
          node tools/explanation-worker-pg-check.mjs
          node tools/explanation-admission-pg-check.mjs
          node tools/explanation-table-class-check.mjs
      - name: Private invocation ledger recovery reporting and deletion
        run: |
          node tools/provider-attempt-pg-check.mjs
          node tools/provider-table-class-check.mjs
      - name: Bounded readiness probes recover after a real PostgreSQL connection loss
        run: node tools/readiness-pg-check.mjs
      - name: The hosted runtime refuses by default
        run: node tools/saas-runtime-check.mjs
      # CONFIG-ANON-01. The machine-global /api/config write (and its read) is gone from the
      # hosted runtime. Anonymous POST and GET are401 at the auth boundary; a real session gets404
      # for the retired route. The env file must stay unchanged, and an anonymous learner route must
      # still refuse 401 (so the 404 is the route being gone, not a dead runtime).
      - name: The unauthenticated machine-global config write is gone
        run: node tools/coord-config-anon-probe.mjs
      # MFP-14. THE CHECK THAT MUST EXIST BEFORE THE MIGRATIONS IT GUARDS. Every table in the app
      # schema is classified as auth / owned / shared-content, and an UNCLASSIFIED table fails - so a
      # migration written by someone who has never read the plan cannot silently weaken a class. It
      # guards the failure mode an architect review rated among the two most dangerous: the deletion
      # read-back is a hand-maintained list (adapter.mjs:243-250), so a new owned table is covered
      # only if someone remembers to add it, and deletion-check would stay green while an account's
      # rows survived in it.
      - name: Every table is classified, and every class rule holds
        run: node tools/table-class-check.mjs
      # Scratch-schema mutations prove policy, deletion, content, key and private-review boundaries.
      - name: Table classification rejects privilege and immutability regressions
        run: node --test tools/table-class-check.test.mjs
      - name: Answer keys are inaccessible to runtime roles while marking still works
        run: node tools/objective-key-access-check.mjs
      - name: Owned history export revisions and withdrawn-content isolation in PostgreSQL
        run: node tools/learner-history-check.mjs --backend=postgres
      - name: Recovered grammar drills preserve keys and owner-scoped evidence
        run: node tools/sentence-building-check.mjs --backend=postgres
      # These are shipped contracts: missing routes fail. Exact saved text, feedback, revision,
      # objective counts, export and deletion are asserted; rendering has its own isolated check.
      - name: The complete saved learner journey over HTTP
        run: node tools/journey-api-check.mjs
  # THE RENDERED-BEHAVIOUR JOB EXISTS AGAIN, FOR THE NEW CLIENT (2 October 2026).
  #
  # The old one was retired with the Certa SPA and this file recorded the consequence: "Those legs live in
  # tools/app-browser-check.mjs, which needs Docker and a browser and is therefore a DEVELOPER-RUN gate, not a
  # runner gate. That trade is recorded, not hidden: nothing in CI renders the client today." Seventeen
  # autonomous rounds produced 89 rendered legs and 35 real-stack legs, and EVERY ONE of them depended on a
  # human remembering to run it. That is the trade this job ends.
  #
  # WHY IT IS NOT A REQUIRED CHECK, AND WHY THAT IS THE POINT: it builds images, starts a Compose project and
  # drives headless Chrome, so it needs a browser in the image, a Docker daemon, and ~20 minutes. The recorded
  # plan is to make it required only after a stretch of green runs -- a rendered gate that is required from day
  # one and flakes teaches people to ignore red, which is worse than a gate that is honest about being new.
  # It therefore runs on the nightly schedule and on demand, never on every push.
  #
  # WHY IT CAN FAIL FOR ENVIRONMENTAL REASONS, SAID OUT LOUD: the two checks need `docker compose` and a Chrome
  # binary. Both are asserted in their own preflight steps, so a missing browser is a named failure rather than
  # a mysterious one, and `CHROME_PATH` is the override that makes the browser's location a configuration value
  # instead of a guess (the check's own candidate list is Windows-shaped plus /usr/bin).
  rendered:
    name: Rendered behaviour (Docker + headless Chrome)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: rendered-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      # PREFLIGHT: the two things this job needs that the offline jobs do not. A named failure here is worth
      # more than a stack trace twenty minutes later, and it tells an operator whether to fix the runner or the
      # code.
      - name: Docker is available
        run: |
          docker version
          docker compose version
      - name: A Chrome binary is available
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          "${CHROME_PATH}" --version
      - name: Install the pinned accessibility test engine
        run: npm ci --prefix tools/a11y --ignore-scripts --no-audit --no-fund
      - name: Real stack - migrations, API, worker and account lifecycle
        timeout-minutes: 12
        run: node tools/docker-stack-check.mjs
      - name: Rendered client and accessibility states at desktop and mobile
        timeout-minutes: 12
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node tools/app-browser-check.mjs --axe --design-evidence=served-only --shots .qa/browser/q01-app
      - name: Isolated two-exam reading and save-before-switch browser acceptance
        timeout-minutes: 12
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node tools/exam-s3-browser-check.mjs
      - name: Isolated DTZ writing choice and mock recovery browser acceptance
        timeout-minutes: 12
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node tools/exam-s4-browser-check.mjs
      - name: Isolated fixed listening and playback recovery browser acceptance
        timeout-minutes: 12
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node tools/exam-s5-browser-check.mjs --axe --shots .qa/browser/q01-audio
      - name: Isolated stub checkout and accessibility states
        timeout-minutes: 12
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node tools/payment-browser-check.mjs --axe --shots .qa/browser/q01-payments
      - name: Complete written mock boundaries and assigned or choice writing
        timeout-minutes: 12
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node tools/exam-s5b-browser-check.mjs
      - name: Public complete DTZ admission and pinned recovery browser acceptance
        timeout-minutes: 12
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node tools/exam-s6-browser-check.mjs
      - name: Review withdrawal preserves draft copies and completed history
        timeout-minutes: 12
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node tools/exam-s6-browser-check.mjs --review --shots .qa/browser/c03-review
      - name: Saved explanation language speech and stale response behavior
        timeout-minutes: 12
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node tools/explanation-browser-check.mjs --shots .qa/browser/pilot07-explanations
      - name: Interface languages preserve live work across account and navigation boundaries
        timeout-minutes: 12
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node tools/exam-s6-browser-check.mjs --locale --shots .qa/browser/pilot-i18n
      - name: Retain synthetic interface language evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pilot-i18n-${{ github.run_id }}-${{ github.run_attempt }}
          path: .qa/browser/pilot-i18n/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Retain synthetic explanation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
