name: Pilot contracts
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Keep the auth spike and restricted-role isolation proofs here. The shared persistent
    # provisioning, owned API, throttle and account HTTP journeys run once in ci.yml's
    # required PostgreSQL job. Both workflows still run for pull requests and main pushes.
    env:
      OWNAPI_PG_HOST: 127.0.0.1
      OWNAPI_PG_PORT: '55435'
      OWNAPI_PG_DATABASE: hatoove_spike
      OWNAPI_PG_USER: postgres
      OWNAPI_PG_SCHEMA: hatoove
      OWNAPI_PG_ROLE_PREFIX: hatoove
      OWNAPI_PG_ALLOW: '1'
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hatoove_spike
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55435:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hatoove_spike"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - run: npm ci --prefix spikes/auth-runtime --ignore-scripts --no-audit --no-fund
      - run: node --test spikes/auth-runtime/test.mjs
      - run: node --test spikes/auth-runtime/isolation.test.mjs
      # OWNAPI-02: the datastore adapter is its own package (root stays dependency-free).
      - name: Install the owned-postgres adapter package (pg 8.23.1)
        run: npm ci --prefix server/owned-postgres --ignore-scripts --no-audit --no-fund
      - name: Owned API suite against PostgreSQL as the restricted learner role
        run: node tools/owned-api-check.mjs --backend=postgres
      - name: Owned API PostgreSQL isolation and RLS discrimination proof
        run: node --test tools/owned-api-pg-check.test.mjs
