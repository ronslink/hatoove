name: Pilot contracts
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hatoove_spike
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55435:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hatoove_spike"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - run: npm ci --prefix spikes/auth-runtime --ignore-scripts --no-audit --no-fund
      - run: node --test spikes/auth-runtime/test.mjs
